id: bottleneck_duckdb_flow
namespace: bottleneck.team

# Mise en place d'une exécution de l’ensemble du workflow tous les 15 du mois à 9h
triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 15 * *"

# Définition des tâches du workflow
tasks:
# Téléchargement des fichiers sources
  - id: download_erp
    type: io.kestra.plugin.core.http.Download
    uri: "https://github.com/Sebules/Project_10_OpenClassrooms_Data_Engineer/raw/refs/heads/main/bottleneck/bottleneck/Fichier_erp.xlsx"

  - id: download_liaison
    type: io.kestra.plugin.core.http.Download
    uri: "https://github.com/Sebules/Project_10_OpenClassrooms_Data_Engineer/raw/refs/heads/main/bottleneck/bottleneck/fichier_liaison.xlsx"

  - id: download_web
    type: io.kestra.plugin.core.http.Download
    uri: "https://github.com/Sebules/Project_10_OpenClassrooms_Data_Engineer/raw/refs/heads/main/bottleneck/bottleneck/Fichier_web.xlsx"

# Création des tables dans DuckDB à partir des fichiers sources
  - id: creation_tables_duckdb
    type: io.kestra.plugin.scripts.python.Script
    containerImage: kestra-custom-image:latest
    inputFiles: 
      function_creation_tables.py: "{{ read('function_creation_tables.py') }}"
      Fichier_erp.xlsx: "{{ outputs.download_erp.uri }}"
      Fichier_liaison.xlsx: "{{ outputs.download_liaison.uri }}"
      Fichier_web.xlsx: "{{ outputs.download_web.uri }}"
    outputFiles:
      - 'bottleneck.db'
    script: |
      from kestra import Kestra
      from function_creation_tables import creation_table

      database = 'bottleneck'
      fichiers = ['Fichier_erp.xlsx', 'Fichier_liaison.xlsx', 'Fichier_web.xlsx']

      tables_export = creation_table(fichiers,database)

      # On expose la valeur en tant qu'output Kestra
      Kestra.outputs({"tables_creees": tables_export})

# Vérification de la création des tables dans DuckDB    
  - id: verif_table_creation
    type: io.kestra.plugin.jdbc.duckdb.Queries
    url: "jdbc:duckdb:"        
    databaseUri: "{{ outputs.creation_tables_duckdb.outputFiles['bottleneck.db'] }}"
    fetchType: STORE
    sql: |-
      ATTACH 'bottleneck.db';  
      SELECT * FROM 'erp_export_data' LIMIT 5;
      SELECT * FROM 'web_export_data' LIMIT 5;
      SELECT * FROM 'liaison_export_data' LIMIT 5;

# Nettoyage des tables dans DuckDB  
  - id: cleaning_tables
    type: io.kestra.plugin.scripts.python.Script
    containerImage: kestra-custom-image:latest
    inputFiles:
      functions_cleaning_tables.py: "{{read('functions_cleaning_tables.py')}}"
      bottleneck.db: "{{ outputs.creation_tables_duckdb.outputFiles['bottleneck.db']}}"     
    outputFiles:
      - 'bottleneck.db'
    script: |
      from functions_cleaning_tables import delete_columns_null, delete_null_row, dedoublement, convert_format
      from kestra import Kestra
      
      tables_export = {{ outputs.creation_tables_duckdb.vars.tables_creees }}
      database = 'bottleneck'

      _,tables_clean1 = delete_columns_null(tables_export,database)
      tables_clean2 = delete_null_row(tables_export,tables_clean1, database)
      tables_clean3 = dedoublement(tables_export,tables_clean2, database)
      tables_clean4 = convert_format(tables_export,tables_clean3, database)

      Kestra.outputs({"tables_nettoyees": tables_clean4})

# Vérification du nettoyage des tables dans DuckDB
  - id: verif_tables_clean
    type: io.kestra.plugin.jdbc.duckdb.Queries
    url: "jdbc:duckdb:"        
    databaseUri: "{{ outputs.cleaning_tables.outputFiles['bottleneck.db'] }}"
    fetchType: STORE
    sql: |-
      ATTACH 'bottleneck.db';  
      
      SELECT * FROM 'erp_export_data_clean' LIMIT 5;
      SELECT * FROM 'web_export_data_clean' LIMIT 5;
      SELECT * FROM 'liaison_export_data_clean' LIMIT 5;

      DESCRIBE FROM 'erp_export_data_clean';
      DESCRIBE FROM 'web_export_data_clean';
      DESCRIBE FROM 'liaison_export_data_clean';

      SUMMARIZE FROM 'erp_export_data_clean';
      SUMMARIZE FROM 'web_export_data_clean';
      SUMMARIZE FROM 'liaison_export_data_clean';

# Nettoyage spécifique des tables dans DuckDB
  - id: cleaning_tables_special
    type: io.kestra.plugin.scripts.python.Script
    containerImage: kestra-custom-image:latest
    inputFiles:
      functions_specific_cleaning_tables.py: "{{read('functions_specific_cleaning_tables.py')}}"
      bottleneck.db: "{{ outputs.cleaning_tables.outputFiles['bottleneck.db']}}"     
    outputFiles:
      - 'bottleneck.db'
    script: |
      from functions_specific_cleaning_tables import delete_negative_price, suppression_lignes
      from kestra import Kestra

      tables_export = {{ outputs.creation_tables_duckdb.vars.tables_creees }}
      tables_clean = {{ outputs.cleaning_tables.vars.tables_nettoyees }}
      database = 'bottleneck'

      tables_clean1,tables_negative_prices = delete_negative_price(tables_export, tables_clean,database)
      
      # Suppression lignes attachment images, concerne la table web_export_data_clean
      tables_clean2 = suppression_lignes(tables_clean1,database,column='post_type',valeur='attachment')

      # Suppression lignes avec sku null, concerne la table web_export_data_clean
      tables_clean3 = suppression_lignes(tables_clean2,database,column='sku',valeur=None)

      Kestra.outputs({"tables_nettoyees": tables_clean3, "tables_prix_negatifs":tables_negative_prices})

# Vérification du nettoyage spécifique des tables dans DuckDB
  - id: verif_tables_clean_specific
    type: io.kestra.plugin.jdbc.duckdb.Queries
    url: "jdbc:duckdb:"        
    databaseUri: "{{ outputs.cleaning_tables_special.outputFiles['bottleneck.db'] }}"
    fetchType: STORE
    sql: |-
      ATTACH 'bottleneck.db';  
      
      SUMMARIZE FROM 'erp_export_data_clean';
      SUMMARIZE FROM 'web_export_data_clean';
      SUMMARIZE FROM 'liaison_export_data_clean';

# Fusion des tables dans DuckDB
  - id: fusion_erp_web_tables
    type: io.kestra.plugin.scripts.python.Script
    containerImage: kestra-custom-image:latest
    inputFiles:
     fusion_tables_liaison.py: "{{read('fusion_tables_liaison.py')}}"
     bottleneck.db: "{{ outputs.cleaning_tables_special.outputFiles['bottleneck.db']}}"
    outputFiles:
      - 'bottleneck.db'
    script: |
      from fusion_tables_liaison import join_tables_with_liaison
      from kestra import Kestra
      database = 'bottleneck'
      table_fusion = join_tables_with_liaison('web_export_data_clean','sku',
                                              'erp_export_data_clean', 'product_id',
                                              'liaison_export_data_clean', 'id_web','product_id',
                                              database, 'web_erp_joined')
      
      Kestra.outputs({"table fusionnée": table_fusion})

# Vérification de la fusion des tables dans DuckDB
  - id: verif_table_fusion
    type: io.kestra.plugin.jdbc.duckdb.Queries
    url: "jdbc:duckdb:"        
    databaseUri: "{{ outputs.fusion_erp_web_tables.outputFiles['bottleneck.db'] }}"
    fetchType: STORE
    sql: |-
      ATTACH 'bottleneck.db';  
      
      SUMMARIZE FROM 'web_erp_joined';
      DESCRIBE FROM 'web_erp_joined';
      SELECT * FROM 'web_erp_joined' LIMIT 5;
      SELECT COUNT(*) FROM 'web_erp_joined';
      SELECT COUNT(*) FROM 'web_export_data_clean';

# Calcul du chiffre d'affaire par produit et global dans DuckDB
  - id: calcul_CA
    type: io.kestra.plugin.scripts.python.Script
    containerImage: kestra-custom-image:latest
    inputFiles:
     bottleneck.db: "{{ outputs.fusion_erp_web_tables.outputFiles['bottleneck.db']}}"
    outputFiles:
      - 'bottleneck.db'
    script: |
      import duckdb

      conn=duckdb.connect()
      conn.sql("ATTACH IF NOT EXISTS 'bottleneck.db';")
      
      #Chiffre d'affaire par produit
      conn.sql("""
      CREATE OR REPLACE TABLE bottleneck.revenus_web AS
      SELECT 
          product_id,
          price,
          total_sales,
          price*total_sales AS CA_product
      FROM bottleneck.web_erp_joined;
      """
      )
      print(conn.sql("FROM bottleneck.revenus_web LIMIT 5;"))

      #Chiffre d'affaire global
      print(conn.sql("SELECT SUM(price*total_sales) AS CA_global FROM bottleneck.revenus_web;"))

      conn.close()

# génération d'un fichier Excel avec le chiffre d'affaire par produit et global dans DuckDB
  - id: generate_excel
    type: io.kestra.plugin.jdbc.duckdb.Queries
    url: "jdbc:duckdb:"        
    databaseUri: "{{ outputs.calcul_CA.outputFiles['bottleneck.db'] }}"
    outputFiles:
      - ca_products.xlsx
    fetchType: STORE
    sql: |-
      ATTACH 'bottleneck.db';
      INSTALL excel;
      LOAD excel;
      COPY (
        SELECT *
        FROM 'revenus_web'
      )
      TO '{{ outputFiles['ca_products.xlsx'] }}'
      WITH (
          FORMAT xlsx,
          HEADER true,
          SHEET 'CA_products'
      );
# génération d'un fichier Excel avec le chiffre d'affaire par produit et global dans DuckDB en utilisant Pandas et Openpyxl      
  - id: generate_excel_2
    type: io.kestra.plugin.scripts.python.Script
    containerImage: kestra-custom-image:latest
    beforeCommands:
      - pip install --no-cache-dir openpyxl
    inputFiles:
      bottleneck.db: "{{ outputs.calcul_CA.outputFiles['bottleneck.db']}}"
    outputFiles:
      - ca_products_global.xlsx
    script: |
      import duckdb
      import pandas as pd
      
      conn = duckdb.connect()
      conn.sql("ATTACH 'bottleneck.db';")
      # Récupérer chaque résultat sous forme de DataFrame
      df_products = conn.sql("""
          SELECT *
          FROM bottleneck.revenus_web
      """).df()

      df_global = conn.sql("""
          SELECT SUM(price * total_sales) AS CA_global
          FROM bottleneck.revenus_web
      """).df()

      # Écrire les deux feuilles dans le même fichier
      with pd.ExcelWriter('{{ outputFiles['ca_products_global.xlsx'] }}', engine='openpyxl') as writer:
          df_products.to_excel(writer, sheet_name='CA_products', index=False)
          df_global.to_excel(writer, sheet_name='CA_global', index=False)
      
      conn.close()

# Calcul du z-score pour la colonne price dans DuckDB
  - id: z_score_calculation
    type: io.kestra.plugin.scripts.python.Script
    containerImage: kestra-custom-image:latest
    inputFiles:
     bottleneck.db: "{{ outputs.calcul_CA.outputFiles['bottleneck.db']}}"
     script_z_score.py: "{{ read('script_z_score.py') }}"
    outputFiles:
      - 'bottleneck.db'
    script: |
      import duckdb
      from kestra import Kestra
      from script_z_score import z_score

      database = 'bottleneck'

      table_z = z_score('web_erp_joined', database, 'price', 'premium')

      Kestra.outputs({"table z-score": table_z})

# Vérification du calcul du z-score pour la colonne price dans DuckDB  
  - id: verif_table_z
    type: io.kestra.plugin.jdbc.duckdb.Queries
    url: "jdbc:duckdb:"        
    databaseUri: "{{ outputs.z_score_calculation.outputFiles['bottleneck.db'] }}"
    fetchType: STORE
    sql: |-
      ATTACH 'bottleneck.db';  
   
      SELECT * FROM 'web_erp_joined_z' LIMIT 5;
  
# Génération de fichiers CSV pour les vins premium et ordinaires dans DuckDB
  - id: vins_premium_ordinaires
    type: io.kestra.plugin.jdbc.duckdb.Queries
    url: "jdbc:duckdb:"
    databaseUri: "{{ outputs.z_score_calculation.outputFiles['bottleneck.db'] }}"
    outputFiles:
      - vins_premium.csv
      - vins_ordinaires.csv
    fetchType: STORE
    sql: |-
      ATTACH 'bottleneck.db';

      SELECT COUNT(*)
      FROM 'web_erp_joined_z'
      WHERE premium = 1;

      COPY (
      SELECT * 
      FROM 'web_erp_joined_z'
      WHERE premium = 1
      )
      TO '{{ outputFiles['vins_premium.csv'] }}' (HEADER, DELIMITER ',');

      SELECT COUNT(*) 
      FROM 'web_erp_joined_z' 
      WHERE premium = 0;

      COPY (
      SELECT * 
      FROM 'web_erp_joined_z' 
      WHERE premium = 0
      )
      TO '{{ outputFiles['vins_ordinaires.csv'] }}' (HEADER, DELIMITER ',');





    







